<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .shoe-upper-left { fill: #00E5FF; filter: drop-shadow(0px 8px 18px rgba(0, 229, 255, 0.4)); }
      .shoe-upper-right { fill: #FF0055; filter: drop-shadow(0px 8px 18px rgba(255, 0, 85, 0.45)); }
      
      .shoe-trim-left { fill: #7000FF; }
      .shoe-trim-right { fill: #7000FF; }
      
      .shoe-sole { fill: #CCFF00; }
      .shoe-sole-dark { fill: #A0D600; }
      
      .lace-line { fill: none; stroke: #FFFFFF; stroke-width: 3.5; stroke-linecap: round; }
      .stripe-accent { fill: #CCFF00; stroke: #121212; stroke-width: 2; }
      
      .bolt-yellow { fill: #FFD600; stroke: #121212; stroke-width: 3; stroke-linejoin: round; }
      .sparkle-pink { fill: #FF0055; }
      .sparkle-cyan { fill: #00E5FF; }
      .star-white { fill: #FFFFFF; }
      
      .speed-line { fill: none; stroke: #CCFF00; stroke-width: 4; stroke-linecap: round; }
      .speed-line-pink { fill: none; stroke: #FF0055; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <g id="pair-running-shoes-sticker">
    <!-- Speed Motion Trails Behind Shoes -->
    <path class="speed-line" d="M 50,220 Q 90,190 140,220" />
    <path class="speed-line-pink" d="M 80,310 Q 130,280 180,310" />
    <path class="speed-line" d="M 340,360 Q 390,330 440,360" />

    <!-- Pair Assembly (Slightly Offset Overlapping Position) -->
    <g transform="translate(10, 10)">
      
      <!-- LEFT SHOE (Electric Cyan & Purple Upper - Positioned Slightly Back) -->
      <g id="shoe-left" transform="translate(10, -25) rotate(-14, 200, 200)">
        <!-- Thick Neon Sole -->
        <path class="shoe-sole" d="
          M 70,300 
          C 120,325 200,305 280,260 
          C 340,225 415,175 440,135 
          C 420,140 395,148 370,170 
          C 300,230 210,285 130,295 
          C 100,298 80,292 70,300 Z" />
        
        <path class="shoe-sole-dark" d="
          M 70,300 
          C 120,322 200,302 280,258 
          C 340,223 415,173 440,133 
          C 418,160 360,200 300,240 
          C 210,295 130,300 70,300 Z" />

        <!-- Heel & Ankle Collar (Purple) -->
        <path class="shoe-trim-left" d="M 300,70 C 310,40 340,25 350,45 C 360,65 400,110 400,110 L 300,110 Z" />
        <path class="shoe-trim-left" d="M 325,52 C 320,30 335,25 340,35 C 345,45 335,52 325,52 Z" />

        <!-- Upper Body (Electric Cyan) -->
        <path class="shoe-upper-left" d="
          M 70,300 
          C 110,265 165,190 195,90 
          C 215,85 235,100 245,118 
          C 270,155 305,65 350,45 
          C 370,100 405,118 440,135 
          C 410,175 330,225 270,260 
          C 190,305 110,325 70,300 Z" />

        <!-- Laces -->
        <path class="lace-line" d="M 185,142 L 235,115 M 170,162 L 220,135 M 155,182 L 205,155 M 140,202 L 190,175" />
        <path class="lace-line" d="M 195,90 C 175,60 155,80 180,105 C 190,115 195,90 195,90 Z" />

        <!-- Side Chevron Accent (Chartreuse Stripe) -->
        <path class="stripe-accent" d="M 240,180 L 300,135 L 320,150 L 260,200 Z" />
      </g>

      <!-- RIGHT SHOE (Hot Pink & Purple Upper - Positioned Foreground / Layered Over) -->
      <g id="shoe-right" transform="translate(45, 45) rotate(-22, 250, 250)">
        <!-- Thick Neon Sole -->
        <path class="shoe-sole" d="
          M 70,300 
          C 120,325 200,305 280,260 
          C 340,225 415,175 440,135 
          C 420,140 395,148 370,170 
          C 300,230 210,285 130,295 
          C 100,298 80,292 70,300 Z" />
        
        <path class="shoe-sole-dark" d="
          M 70,300 
          C 120,322 200,302 280,258 
          C 340,223 415,173 440,133 
          C 418,160 360,200 300,240 
          C 210,295 130,300 70,300 Z" />

        <!-- Heel & Ankle Collar (Purple) -->
        <path class="shoe-trim-right" d="M 300,70 C 310,40 340,25 350,45 C 360,65 400,110 400,110 L 300,110 Z" />
        <path class="shoe-trim-right" d="M 325,52 C 320,30 335,25 340,35 C 345,45 335,52 325,52 Z" />

        <!-- Upper Body (Hot Pink / Magenta) -->
        <path class="shoe-upper-right" d="
          M 70,300 
          C 110,265 165,190 195,90 
          C 215,85 235,100 245,118 
          C 270,155 305,65 350,45 
          C 370,100 405,118 440,135 
          C 410,175 330,225 270,260 
          C 190,305 110,325 70,300 Z" />

        <!-- Laces -->
        <path class="lace-line" d="M 185,142 L 235,115 M 170,162 L 220,135 M 155,182 L 205,155 M 140,202 L 190,175" />
        <path class="lace-line" d="M 195,90 C 175,60 155,80 180,105 C 190,115 195,90 195,90 Z" />

        <!-- Side Chevron Accent (Chartreuse Stripe) -->
        <path class="stripe-accent" d="M 240,180 L 300,135 L 320,150 L 260,200 Z" />
      </g>

    </g>

    <!-- Floating Energy Pop Accents -->
    <!-- Top Right Yellow Lightning Bolt -->
    <g transform="translate(390, 40) rotate(20) scale(1.4)">
      <polygon class="bolt-yellow" points="20,0 0,25 15,25 5,50 35,20 18,20" />
    </g>

    <!-- Bottom Left Lime Sparkle -->
    <path class="sparkle-cyan" d="M 60,360 Q 80,360 80,340 Q 80,360 100,360 Q 80,360 80,380 Q 80,360 60,360 Z" />

    <!-- Top Left Pink Sparkle -->
    <path class="sparkle-pink" d="M 70,100 Q 90,100 90,80 Q 90,100 110,100 Q 90,100 90,120 Q 90,100 70,100 Z" />

    <!-- Floating Sparkle Stars & Dots -->
    <polygon class="star-white" transform="translate(430, 220) scale(1.0)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <polygon class="star-white" transform="translate(180, 35) scale(0.8)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <circle cx="450" cy="370" r="9" fill="#CCFF00" />
    <circle cx="425" cy="400" r="5" fill="#00E5FF" />
    <circle cx="95" cy="410" r="6" fill="#FF0055" />
  </g>
</svg>