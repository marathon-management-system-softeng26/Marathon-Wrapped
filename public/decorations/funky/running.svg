<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .runner-body { fill: #00E5FF; filter: drop-shadow(0px 10px 22px rgba(0, 229, 255, 0.45)); }
      .runner-skin { fill: #FFB380; }
      .runner-top { fill: #FF0055; }
      .runner-shorts { fill: #7000FF; }
      .runner-hair { fill: #2B0914; }
      .runner-shoe { fill: #CCFF00; stroke: #121212; stroke-width: 2.5; }
      .bolt-yellow { fill: #FFD600; stroke: #121212; stroke-width: 3; stroke-linejoin: round; }
      .speed-trail { fill: none; stroke: #CCFF00; stroke-width: 6; stroke-linecap: round; }
      .speed-trail-pink { fill: none; stroke: #FF0055; stroke-width: 4; stroke-linecap: round; }
      .sparkle-pink { fill: #FF0055; }
      .sparkle-purple { fill: #7000FF; }
      .star-white { fill: #FFFFFF; }
      .motion-blur { fill: #00E5FF; opacity: 0.25; }
    </style>
  </defs>

  <g id="smooth-runner-sticker">
    <!-- Speed Motion Trails (Behind Runner) -->
    <path class="speed-trail" d="M 60,260 C 110,240 180,250 250,220" />
    <path class="speed-trail-pink" d="M 80,310 C 130,290 200,300 270,270" />
    <path class="speed-trail" d="M 120,360 C 170,340 230,350 300,320" stroke-width="4" />

    <!-- Motion Blur Duplicate (Smooth Trail Effect) -->
    <g transform="translate(-18, 8) rotate(-12, 250, 250)" class="motion-blur">
      <path d="M 170,180 C 180,120 230,110 270,130 C 310,150 370,190 410,230 C 370,280 290,320 210,340 C 160,350 120,310 170,180 Z" />
    </g>

    <!-- Smooth Dynamic Runner Silhouette in Full Stride (Angled Forward) -->
    <g transform="translate(15, -15) rotate(-12, 250, 250)">
      
      <!-- Back Extended Leg (Smooth Sweeping Curve) -->
      <path class="runner-skin" d="M 220,270 C 160,300 100,340 50,380 C 40,390 55,405 70,395 C 120,350 180,310 240,285 Z" />
      <!-- Back Shoe -->
      <path class="runner-shoe" d="M 50,380 C 35,395 25,410 40,418 C 55,420 70,405 70,395 Z" />

      <!-- Back Arm (Smooth Swings Back) -->
      <path class="runner-skin" d="M 230,160 C 180,180 130,210 100,240 C 92,248 105,258 115,250 C 145,225 195,195 240,175 Z" />

      <!-- Smooth Torso & Active Wear -->
      <!-- Hot Pink Athletic Top -->
      <path class="runner-top" d="
        M 220,130 
        C 250,115 285,120 300,140 
        C 290,180 270,210 250,230 
        C 230,220 215,180 220,130 Z" />

      <!-- Purple Running Shorts -->
      <path class="runner-shorts" d="
        M 250,230 
        C 270,210 290,210 300,225 
        C 310,250 280,285 260,290 
        C 240,280 235,250 250,230 Z" />

      <!-- Front High-Knee Driving Leg (Smooth Curvaceous Shape) -->
      <path class="runner-skin" d="
        M 260,275 
        C 310,250 360,230 390,265 
        C 400,280 370,330 355,370 
        C 345,380 330,370 340,350 
        C 355,315 375,280 345,270 
        C 315,260 280,280 260,275 Z" />
      
      <!-- Front Shoe (Striking Forward) -->
      <path class="runner-shoe" d="M 355,370 C 350,390 360,410 380,405 C 395,400 390,380 375,365 Z" />

      <!-- Smooth Head & Swishing Hair Profile -->
      <g id="smooth-head">
        <!-- Neck -->
        <path class="runner-skin" d="M 245,110 C 255,100 270,105 270,120 Z" />
        
        <!-- Face Profile -->
        <circle cx="260" cy="85" r="28" class="runner-skin" />
        
        <!-- Dynamic Windblown Hair -->
        <path class="runner-hair" d="
          M 240,70 
          C 190,40 140,60 110,85 
          C 150,105 190,95 245,90 
          C 270,88 280,70 260,65 Z" />

        <!-- Cool Cyan Visor -->
        <path d="M 250,75 C 275,68 300,72 310,82 C 295,90 270,88 250,82 Z" fill="#00E5FF" stroke="#121212" stroke-width="2.5" />
      </g>

      <!-- Front Bent Arm (Power Drive Forward) -->
      <path class="runner-skin" d="
        M 265,145 
        C 305,170 345,200 325,230 
        C 315,240 295,225 308,210 
        C 320,192 288,170 255,155 Z" />

      <!-- Smartwatch Accent -->
      <rect x="305" y="210" width="12" height="18" rx="5" fill="#CCFF00" stroke="#121212" stroke-width="2" transform="rotate(25, 305, 210)" />

    </g>

    <!-- Floating Energy Pop Accents (No Text Overlay) -->
    <!-- Top Right Energy Lightning Bolt -->
    <g transform="translate(385, 55) rotate(20) scale(1.4)">
      <polygon class="bolt-yellow" points="20,0 0,25 15,25 5,50 35,20 18,20" />
    </g>

    <!-- Top Left Purple Sparkle -->
    <path class="sparkle-purple" d="M 80,100 Q 100,100 100,80 Q 100,100 120,100 Q 100,100 100,120 Q 100,100 80,100 Z" />

    <!-- Bottom Left Hot Pink Sparkle -->
    <path class="sparkle-pink" d="M 60,340 Q 80,340 80,320 Q 80,340 100,340 Q 80,340 80,360 Q 80,340 60,340 Z" />

    <!-- Floating Sparkle Stars & Neon Dots -->
    <polygon class="star-white" transform="translate(420, 240) scale(1.0)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <polygon class="star-white" transform="translate(190, 40) scale(0.8)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <circle cx="445" cy="380" r="9" fill="#CCFF00" />
    <circle cx="420" cy="410" r="5" fill="#00E5FF" />
    <circle cx="95" cy="180" r="7" fill="#FF0055" />
  </g>
</svg>