<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .watch-body { fill: #00E5FF; filter: drop-shadow(0px 10px 22px rgba(0, 229, 255, 0.45)); stroke: #121212; stroke-width: 4; stroke-linejoin: round; }
      .watch-screen { fill: #121212; stroke: #CCFF00; stroke-width: 3.5; }
      .strap-green { fill: #CCFF00; stroke: #121212; stroke-width: 3.5; stroke-linejoin: round; }
      .strap-detail { fill: #7000FF; stroke: #121212; stroke-width: 2.5; }
      
      .heart-icon { fill: #FF0055; filter: drop-shadow(0px 0px 8px rgba(255, 0, 85, 0.7)); }
      .ekg-line { fill: none; stroke: #CCFF00; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .ring-activity { fill: none; stroke: #00E5FF; stroke-width: 6; stroke-linecap: round; }
      .ring-burn { fill: none; stroke: #FF0055; stroke-width: 6; stroke-linecap: round; }
      .ring-stand { fill: none; stroke: #CCFF00; stroke-width: 6; stroke-linecap: round; }
      
      .bolt-yellow { fill: #FFD600; stroke: #121212; stroke-width: 3; stroke-linejoin: round; }
      .sparkle-pink { fill: #FF0055; }
      .sparkle-cyan { fill: #00E5FF; }
      .star-white { fill: #FFFFFF; }
      .speed-line { fill: none; stroke: #CCFF00; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <g id="healthy-smartwatch-item-sticker">
    <!-- Speed Motion Trails Behind Watch -->
    <path class="speed-line" d="M 60,200 Q 110,180 160,210" />
    <path class="speed-line" d="M 40,240 Q 90,220 140,250" stroke="#FF0055" stroke-width="3" />
    <path class="speed-line" d="M 340,300 Q 390,280 440,310" />

    <!-- Top & Bottom Straps -->
    <g transform="translate(10, 10) rotate(-8, 250, 250)">
      <!-- Top Strap -->
      <path class="strap-green" d="M 200,30 L 300,30 L 285,130 L 215,130 Z" />
      <rect class="strap-detail" x="225" y="55" width="50" height="12" rx="6" />
      <rect class="strap-detail" x="228" y="80" width="44" height="12" rx="6" />

      <!-- Bottom Strap -->
      <path class="strap-green" d="M 215,370 L 285,370 L 300,470 L 200,470 Z" />
      <circle cx="250" cy="400" r="6" fill="#121212" />
      <circle cx="250" cy="430" r="6" fill="#121212" />
    </g>

    <!-- Main Watch Case Assembly -->
    <g transform="translate(10, 10) rotate(-8, 250, 250)">
      
      <!-- Bezel Outer Frame -->
      <rect class="watch-body" x="135" y="125" width="230" height="250" rx="48" />

      <!-- Side Crown & Buttons -->
      <rect class="strap-green" x="365" y="180" width="14" height="40" rx="5" />
      <rect class="strap-green" x="365" y="250" width="14" height="50" rx="5" />
      <rect class="strap-detail" x="121" y="200" width="14" height="45" rx="5" />

      <!-- Digital Screen -->
      <rect class="watch-screen" x="155" y="145" width="190" height="210" rx="32" />

      <!-- HEALTH DISPLAY GRAPHICS (No text) -->
      <!-- Outer Health Activity Rings -->
      <circle class="ring-burn" cx="245" cy="250" r="70" stroke-dasharray="320" stroke-dashoffset="60" />
      <circle class="ring-activity" cx="245" cy="250" r="55" stroke-dasharray="270" stroke-dashoffset="80" />
      <circle class="ring-stand" cx="245" cy="250" r="40" stroke-dasharray="210" stroke-dashoffset="40" />

      <!-- Pulsing Glowing Heart Icon in Center -->
      <path class="heart-icon" d="M 245,225 C 235,205 210,210 210,230 C 210,248 245,268 245,268 C 245,268 280,248 280,230 C 280,210 255,205 245,225 Z" />

      <!-- Neon Green EKG Heartbeat Pulse Wave Across Screen -->
      <path class="ekg-line" d="M 165,250 L 195,250 L 205,235 L 218,270 L 232,220 L 245,260 L 255,245 L 265,250 L 325,250" />

      <!-- Top & Bottom Status Indicator Dots -->
      <circle cx="245" cy="165" r="5" fill="#CCFF00" />
      <circle cx="225" cy="165" r="3" fill="#00E5FF" />
      <circle cx="265" cy="165" r="3" fill="#FF0055" />

    </g>

    <!-- Floating Energy Pop Accents -->
    <!-- Top Right Yellow Lightning Bolt -->
    <g transform="translate(385, 45) rotate(22) scale(1.4)">
      <polygon class="bolt-yellow" points="20,0 0,25 15,25 5,50 35,20 18,20" />
    </g>

    <!-- Bottom Left Hot Pink Sparkle -->
    <path class="sparkle-pink" d="M 60,350 Q 80,350 80,330 Q 80,350 100,350 Q 80,350 80,370 Q 80,350 60,350 Z" />

    <!-- Top Left Cyan Sparkle -->
    <path class="sparkle-cyan" d="M 70,120 Q 90,120 90,100 Q 90,120 110,120 Q 90,120 90,140 Q 90,120 70,120 Z" />

    <!-- Floating Sparkle Stars & Dots -->
    <polygon class="star-white" transform="translate(425, 230) scale(1.0)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <polygon class="star-white" transform="translate(60, 220) scale(0.8)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <circle cx="445" cy="370" r="9" fill="#CCFF00" />
    <circle cx="420" cy="400" r="5" fill="#00E5FF" />
    <circle cx="90" cy="410" r="6" fill="#FF0055" />
  </g>
</svg>