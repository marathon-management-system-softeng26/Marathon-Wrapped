<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .skin-dark { fill: #C67C52; }
      .hair-dark { fill: #121212; }
      
      .singlet-purple { fill: #7000FF; filter: drop-shadow(0px 8px 18px rgba(112, 0, 255, 0.45)); }
      .shorts-pink { fill: #FF0055; }
      .shoe-cyan { fill: #00E5FF; stroke: #121212; stroke-width: 2.5; }
      .shoe-sole { fill: #CCFF00; }
      
      .finish-tape { fill: #CCFF00; stroke: #121212; stroke-width: 3.5; stroke-linejoin: round; filter: drop-shadow(0px 6px 16px rgba(204, 255, 0, 0.6)); }
      
      .bolt-yellow { fill: #FFD600; stroke: #121212; stroke-width: 3; stroke-linejoin: round; }
      .sparkle-pink { fill: #FF0055; }
      .sparkle-cyan { fill: #00E5FF; }
      .star-white { fill: #FFFFFF; }
      
      .speed-line { fill: none; stroke: #CCFF00; stroke-width: 5; stroke-linecap: round; }
      .speed-line-pink { fill: none; stroke: #FF0055; stroke-width: 3.5; stroke-linecap: round; }
      .confetti { fill: #CCFF00; }
    </style>
  </defs>

  <g id="guy-crossing-finish-line-sticker">
    <!-- Motion Speed Trails Behind Runner -->
    <path class="speed-line" d="M 40,240 C 90,220 160,230 220,200" />
    <path class="speed-line-pink" d="M 20,280 C 70,260 140,270 200,240" />
    <path class="speed-line" d="M 50,330 C 100,310 170,320 230,290" />

    <!-- Runner Guy Crossing Finish Line -->
    <g transform="translate(10, 0) rotate(-6, 250, 250)">
      
      <!-- Back Leg (Extended Straight Back) -->
      <path class="skin-dark" d="M 220,270 C 160,300 100,340 50,380 C 40,390 55,405 70,395 C 120,350 180,310 240,285 Z" />
      <path class="shoe-cyan" d="M 50,380 C 35,395 25,410 40,418 C 55,420 70,405 70,395 Z" />
      <path class="shoe-sole" d="M 38,412 L 62,408 L 72,398 Z" />

      <!-- Back Arm (Raised High in Victory) -->
      <path class="skin-dark" d="M 230,160 C 190,120 150,70 165,55 C 180,40 210,90 245,145 Z" />

      <!-- Torso & Activewear (Tilted Back in Victory Breakout) -->
      <!-- Electric Purple Singlet -->
      <path class="singlet-purple" d="
        M 220,130 
        C 250,115 285,120 300,140 
        C 290,180 270,210 250,230 
        C 230,220 215,180 220,130 Z" />

      <!-- Hot Pink Shorts -->
      <path class="shorts-pink" d="
        M 250,230 
        C 270,210 290,210 300,225 
        C 310,250 280,285 260,290 
        C 240,280 235,250 250,230 Z" />

      <!-- Front Leg (Lunge Forward Over Finish Line) -->
      <path class="skin-dark" d="
        M 260,275 
        C 310,250 360,230 390,265 
        C 400,280 370,330 355,370 
        C 345,380 330,370 340,350 
        C 355,315 375,280 345,270 
        C 315,260 280,280 260,275 Z" />
      <path class="shoe-cyan" d="M 355,370 C 350,390 360,410 380,405 C 395,400 390,380 375,365 Z" />
      <path class="shoe-sole" d="M 352,402 C 368,412 390,406 385,398 Z" />

      <!-- Front Arm (Raised Up Celebrating) -->
      <path class="skin-dark" d="
        M 265,145 
        C 310,110 350,60 368,75 
        C 380,90 335,135 280,160 Z" />

      <!-- Head (Tilted Upward Celebrating) -->
      <circle cx="260" cy="80" r="26" class="skin-dark" />
      <path class="hair-dark" d="M 240,65 C 220,45 255,35 270,45 C 280,52 282,65 275,72 C 268,60 252,55 240,65 Z" />
      <!-- Sunglasses -->
      <path d="M 250,70 C 275,63 300,67 310,77 C 295,85 270,83 250,77 Z" fill="#00E5FF" stroke="#121212" stroke-width="2" />

      <!-- BROKEN NEON FINISH LINE TAPE (Wrapping across chest) -->
      <!-- Left Snapped Ribbon -->
      <path class="finish-tape" d="M 120,240 C 180,210 240,200 285,185 L 295,205 C 240,225 180,235 120,265 Z" />
      <!-- Right Snapped Flying Ribbon -->
      <path class="finish-tape" d="M 290,175 C 340,150 400,160 450,140 L 440,165 C 395,180 340,170 295,195 Z" />

    </g>

    <!-- Floating Confetti & Energy Pops -->
    <!-- Top Right Yellow Lightning Bolt -->
    <g transform="translate(390, 35) rotate(22) scale(1.4)">
      <polygon class="bolt-yellow" points="20,0 0,25 15,25 5,50 35,20 18,20" />
    </g>

    <!-- Confetti Sparks -->
    <circle cx="140" cy="60" r="6" class="confetti" />
    <rect x="320" y="40" width="10" height="10" rx="2" class="sparkle-pink" transform="rotate(25, 320, 40)" />
    <rect x="100" y="150" width="12" height="6" rx="2" class="sparkle-cyan" transform="rotate(-30, 100, 150)" />
    <rect x="420" y="260" width="10" height="10" rx="2" class="confetti" transform="rotate(15, 420, 260)" />

    <!-- Bottom Left Cyan Sparkle -->
    <path class="sparkle-cyan" d="M 50,360 Q 70,360 70,340 Q 70,360 90,360 Q 70,360 70,380 Q 70,360 50,360 Z" />

    <!-- Sparkle Stars -->
    <polygon class="star-white" transform="translate(435, 200) scale(1.0)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <polygon class="star-white" transform="translate(80, 90) scale(0.8)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <circle cx="455" cy="350" r="9" fill="#CCFF00" />
    <circle cx="430" cy="380" r="5" fill="#00E5FF" />
    <circle cx="95" cy="410" r="6" fill="#FF0055" />
  </g>
</svg>