<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .watch-body { fill: #00E5FF; filter: drop-shadow(0px 8px 18px rgba(0, 229, 255, 0.4)); }
      .watch-screen { fill: #121212; stroke: #CCFF00; stroke-width: 4; }
      .strap-green { fill: #CCFF00; }
      .strap-detail { fill: #00B0FF; }
      .text-large { fill: #CCFF00; font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; text-anchor: middle; }
      .text-small { fill: #FFFFFF; font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; text-anchor: middle; }
      .text-sub { fill: #FF0055; font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; text-anchor: middle; }
      .bolt-yellow { fill: #FFD600; stroke: #1A1A1A; stroke-width: 2.5; stroke-linejoin: round; }
      .sparkle-pink { fill: #FF0055; }
      .star-white { fill: #FFFFFF; }
      .speed-line { fill: none; stroke: #CCFF00; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>

  <g id="pace-watch-sticker">
    <!-- Speed Motion Lines (Back) -->
    <path class="speed-line" d="M 60,180 Q 20,200 40,240" />
    <path class="speed-line" d="M 40,260 Q 15,290 50,310" stroke-width="3.5" />
    <path class="speed-line" d="M 430,160 Q 470,190 440,230" />

    <!-- Top & Bottom Straps -->
    <!-- Top Strap -->
    <path class="strap-green" d="M 200,40 L 300,40 L 285,130 L 215,130 Z" />
    <rect class="strap-detail" x="225" y="60" width="50" height="12" rx="6" />
    <rect class="strap-detail" x="228" y="85" width="44" height="12" rx="6" />

    <!-- Bottom Strap -->
    <path class="strap-green" d="M 215,370 L 285,370 L 300,460 L 200,460 Z" />
    <circle cx="250" cy="400" r="6" fill="#1A1A1A" />
    <circle cx="250" cy="425" r="6" fill="#1A1A1A" />

    <!-- Main Watch Case (Angled slightly) -->
    <g transform="rotate(-8, 250, 250)">
      
      <!-- Bezel Outer Frame -->
      <rect class="watch-body" x="135" y="125" width="230" height="250" rx="48" />

      <!-- Side Buttons -->
      <rect class="strap-green" x="365" y="180" width="14" height="40" rx="5" />
      <rect class="strap-green" x="365" y="250" width="14" height="50" rx="5" />
      <rect class="strap-detail" x="121" y="200" width="14" height="45" rx="5" />

      <!-- Digital Screen -->
      <rect class="watch-screen" x="155" y="145" width="190" height="210" rx="32" />

      <!-- Screen Display Graphics -->
      <!-- Top Tag -->
      <rect x="200" y="165" width="100" height="22" rx="11" fill="#FF0055" />
      <text class="text-small" x="250" y="181" font-size="12" letter-spacing="2">AVG PACE</text>

      <!-- Big Pace Metric -->
      <text class="text-large" x="250" y="248" font-size="52" letter-spacing="-1">5:58</text>
      <text class="text-sub" x="250" y="278" font-size="20" letter-spacing="2">/KM</text>

      <!-- Bottom Split Stat Badge -->
      <line x1="175" y1="292" x2="325" y2="292" stroke="#333333" stroke-width="3" stroke-linecap="round" />
      <text class="text-small" x="250" y="325" font-size="16" fill="#00E5FF" letter-spacing="1">FASTEST KM 9</text>

    </g>

    <!-- Outer Decorative Pops -->
    <!-- Top Right Energy Bolt -->
    <g transform="translate(360, 65) rotate(20) scale(1.2)">
      <polygon class="bolt-yellow" points="20,0 0,25 15,25 5,50 35,20 18,20" />
    </g>

    <!-- Bottom Left Sparkle -->
    <path class="sparkle-pink" d="M 90,370 Q 110,370 110,350 Q 110,370 130,370 Q 110,370 110,390 Q 110,370 90,370 Z" />

    <!-- Floating Accent Stars & Dots -->
    <polygon class="star-white" transform="translate(110, 120) scale(0.8)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <circle cx="395" cy="340" r="7" fill="#CCFF00" />
    <circle cx="415" cy="360" r="4" fill="#FFFFFF" />
  </g>
</svg>