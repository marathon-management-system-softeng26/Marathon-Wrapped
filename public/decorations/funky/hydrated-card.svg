<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bottle-body { fill: #FF0055; filter: drop-shadow(0px 10px 22px rgba(255, 0, 85, 0.45)); }
      .bottle-cap { fill: #121212; stroke: #00E5FF; stroke-width: 3.5; stroke-linejoin: round; }
      .badge-hydration { fill: #CCFF00; stroke: #121212; stroke-width: 3.5; stroke-linejoin: round; }
      .water-splash { fill: #00E5FF; opacity: 0.9; }
      .water-drop { fill: #00E5FF; stroke: #FFFFFF; stroke-width: 2; }
      .text-black { fill: #121212; font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; text-anchor: middle; }
      .text-white { fill: #FFFFFF; font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; text-anchor: middle; }
      .bolt-yellow { fill: #FFD600; stroke: #121212; stroke-width: 3; stroke-linejoin: round; }
      .sparkle-purple { fill: #7000FF; }
      .star-white { fill: #FFFFFF; }
      .squeeze-line { fill: none; stroke: #FFFFFF; stroke-width: 4; stroke-linecap: round; opacity: 0.8; }
    </style>
  </defs>

  <g id="squeezy-water-bottle-sticker">
    <!-- Water Splashes / Spray Burst (Top Left) -->
    <g id="water-burst">
      <path class="water-splash" d="M 120,120 C 80,90 60,50 75,40 C 90,30 110,70 120,85 Z" />
      <path class="water-splash" d="M 140,90 C 130,50 145,20 160,25 C 175,30 160,65 150,85 Z" />
      <path class="water-splash" d="M 165,110 C 185,80 220,60 225,75 C 230,90 195,105 175,120 Z" />
      <!-- Water Droplets -->
      <path class="water-drop" d="M 60,80 C 60,80 45,100 45,110 C 45,118 52,125 60,125 C 68,125 75,118 75,110 C 75,100 60,80 60,80 Z" />
      <path class="water-drop" d="M 190,45 C 190,45 180,60 180,68 C 180,73 184,78 190,78 C 196,78 200,73 200,68 C 200,60 190,45 190,45 Z" />
      <path class="water-drop" d="M 235,100 C 235,100 225,112 225,118 C 225,122 229,126 235,126 C 241,126 245,122 245,118 C 245,112 235,100 235,100 Z" />
    </g>

    <!-- Main Squeezy Bottle (Angled at 20deg) -->
    <g transform="translate(15, 20) rotate(22, 250, 250)">
      
      <!-- Black Cap & Nozzle -->
      <!-- Pull Nozzle Top -->
      <rect class="bottle-cap" x="185" y="60" width="30" height="25" rx="8" />
      <!-- Main Cap Base -->
      <path class="bottle-cap" d="
        M 155,85 
        L 245,85 
        C 252,85 258,92 255,102 
        L 245,130 
        L 155,130 
        L 145,102 
        C 142,92 148,85 155,85 Z" />

      <!-- Squeezed Bottle Body (Electric Hot Pink) -->
      <!-- Contoured Indentation to give the 'Squeezed' effect -->
      <path class="bottle-body" d="
        M 150,130 
        L 250,130 
        C 265,130 275,145 270,165 
        L 260,210 
        C 252,240 270,270 275,300 
        L 265,380 
        C 260,410 235,420 200,420 
        C 165,420 140,410 135,380 
        L 125,300 
        C 130,270 148,240 140,210 
        L 130,165 
        C 125,145 135,130 150,130 Z" />

      <!-- Squeeze Grip Ridges / Highlights -->
      <path class="squeeze-line" d="M 148,215 C 160,240 160,260 145,285" />
      <path class="squeeze-line" d="M 252,215 C 240,240 240,260 255,285" />
      <path class="squeeze-line" d="M 170,150 L 170,180" stroke-width="5" />

      <!-- Water Drop Graphic on Bottle -->
      <path d="M 200,220 C 200,220 175,255 175,272 C 175,286 186,298 200,298 C 214,298 225,286 225,272 C 225,255 200,220 200,220 Z" fill="#00E5FF" opacity="0.9" />

    </g>

    <!-- Overlay Badge: "STAY HYDRATED" -->
    <g transform="translate(190, 310) rotate(-8)">
      <!-- Outer Shadow Box -->
      <rect x="-10" y="-10" width="260" height="95" rx="26" fill="#121212" />
      <!-- Main Badge Box (Chartreuse Yellow) -->
      <rect class="badge-hydration" x="-10" y="-10" width="255" height="90" rx="23" />
      
      <!-- Badge Text -->
      <text class="text-black" x="117" y="28" font-size="20" letter-spacing="3">100%</text>
      <text class="text-black" x="117" y="65" font-size="36" letter-spacing="1">HYDRATED</text>
    </g>

    <!-- Floating Energy Pop Accents -->
    <!-- Top Right Yellow Lightning Bolt -->
    <g transform="translate(380, 75) rotate(18) scale(1.3)">
      <polygon class="bolt-yellow" points="20,0 0,25 15,25 5,50 35,20 18,20" />
    </g>

    <!-- Bottom Left Purple Sparkle -->
    <path class="sparkle-purple" d="M 70,360 Q 90,360 90,340 Q 90,360 110,360 Q 90,360 90,380 Q 90,360 70,360 Z" />

    <!-- Floating Stars & Dots -->
    <polygon class="star-white" transform="translate(420, 260) scale(0.9)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <polygon class="star-white" transform="translate(80, 220) scale(0.7)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <circle cx="435" cy="380" r="8" fill="#CCFF00" />
    <circle cx="410" cy="405" r="5" fill="#00E5FF" />
    <circle cx="95" cy="410" r="6" fill="#FF0055" />
  </g>
</svg>