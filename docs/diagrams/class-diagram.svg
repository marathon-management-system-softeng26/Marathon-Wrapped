<svg xmlns="http://www.w3.org/2000/svg" width="2003pt" height="1918pt" viewBox="0.00 0.00 2003.00 1918.00" role="img" aria-labelledby="class-diagram-title class-diagram-desc">
<title id="class-diagram-title">UML classes: the information behind a personal recap</title><desc id="class-diagram-desc">One event has race categories; each category groups runners. Each seeded demonstration runner has one result and recorded kilometer splits. Strava metrics are optional at most one, and BIB-matched race photos are optional many. This is a conceptual UML model with human-readable attributes, not a physical database schema.</desc><g id="graph0" class="graph" transform="scale(2 2) rotate(0) translate(28.8 929.95)">
