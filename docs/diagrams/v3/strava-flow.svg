<title id="strava-flow-title">Strava is your choice: extra detail, never a prerequisite</title><desc id="strava-flow-desc">The runner may skip Strava, deny permission, or authorize available metrics. Failed requests fall back to the baseline. Connected runners may disconnect; successful disconnection removes or invalidates the connection while preserving timing results. Failure recovery for disconnection remains an open decision.</desc><g id="graph0" class="graph" transform="scale(2 2) rotate(0) translate(28.8 1486.48)">
