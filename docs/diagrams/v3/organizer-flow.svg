<title id="organizer-flow-title">Organizer journey: keep the demonstration ready</title><desc id="organizer-flow-desc">The organizer views all event results, then optionally creates or updates demonstration runners through the interface. Rejected saves show a correction path. The dataset needs three complete hero runners and DNF, missing-Strava and missing-photo cases. Organizer access and atomic saves require further team decisions.</desc><g id="graph0" class="graph" transform="scale(2 2) rotate(0) translate(28.8 971.68)">
