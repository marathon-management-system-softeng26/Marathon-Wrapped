<title id="architecture-title">Anticipated architecture: who owns each responsibility</title><desc id="architecture-desc">Anticipated project functions include runner recap/gallery/export, organizer management, race calculations, data access and optional Strava connection. They use the selected Next.js, Supabase database/storage, Strava and Vercel platforms. This is a responsibility model, not a report of completed integrations.</desc><g id="graph0" class="graph" transform="scale(2 2) rotate(0) translate(28.8 696.3)">
