<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .medal-ribbon-left { fill: #FF0055; stroke: #121212; stroke-width: 3.5; stroke-linejoin: round; }
      .medal-ribbon-right { fill: #00E5FF; stroke: #121212; stroke-width: 3.5; stroke-linejoin: round; }
      .ribbon-stripe { fill: #CCFF00; }
      
      .medal-outer { fill: #FFD600; filter: drop-shadow(0px 10px 22px rgba(255, 214, 0, 0.45)); stroke: #121212; stroke-width: 4; }
      .medal-inner { fill: #7000FF; stroke: #121212; stroke-width: 3; }
      .medal-star { fill: #CCFF00; stroke: #121212; stroke-width: 2.5; stroke-linejoin: round; }
      .medal-ring { fill: none; stroke: #00E5FF; stroke-width: 4; stroke-dasharray: 6 6; }
      
      .bolt-yellow { fill: #FFD600; stroke: #121212; stroke-width: 3; stroke-linejoin: round; }
      .sparkle-pink { fill: #FF0055; }
      .sparkle-cyan { fill: #00E5FF; }
      .star-white { fill: #FFFFFF; }
      .speed-line { fill: none; stroke: #CCFF00; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <g id="finisher-medal-item-sticker">
    <!-- Speed / Motion Lines Behind Medal -->
    <path class="speed-line" d="M 120,80 Q 90,120 70,160" />
    <path class="speed-line" d="M 380,80 Q 410,120 430,160" stroke="#FF0055" />

    <!-- Main Ribbon Group -->
    <g id="ribbon">
      <!-- Left Strap (Hot Pink) -->
      <path class="medal-ribbon-left" d="
        M 170,40 
        C 180,100 210,180 230,220 
        L 250,230 
        L 200,100 
        L 190,40 Z" />
      <path class="ribbon-stripe" d="M 178,40 C 188,100 215,175 235,215 L 243,212 C 223,172 196,97 186,40 Z" />

      <!-- Right Strap (Electric Cyan) -->
      <path class="medal-ribbon-right" d="
        M 330,40 
        C 320,100 290,180 270,220 
        L 250,230 
        L 300,100 
        L 310,40 Z" />
      <path class="ribbon-stripe" d="M 322,40 C 312,100 285,175 265,215 L 257,212 C 277,172 304,97 314,40 Z" />

      <!-- Ribbon Top Ring / Buckle -->
      <rect x="230" y="215" width="40" height="20" rx="6" fill="#121212" stroke="#CCFF00" stroke-width="3" />
    </g>

    <!-- Main Dynamic Finisher Medal (Gold & Neon) -->
    <g transform="translate(0, 30)">
      
      <!-- Outer Gold Starburst/Cog Medal Body -->
      <path class="medal-outer" d="
        M 250,190 
        L 265,205 L 285,195 L 295,215 L 315,212 L 320,232 L 338,235 L 338,255 L 352,265 L 345,285 L 355,300 L 342,318 L 345,338 L 328,348 L 325,368 L 305,372 L 298,390 L 280,388 L 268,402 L 250,395 L 232,402 L 220,388 L 202,390 L 195,372 L 175,368 L 172,348 L 155,338 L 158,318 L 145,300 L 155,285 L 148,265 L 162,255 L 162,235 L 180,232 L 185,212 L 205,215 L 215,195 L 235,205 Z" />

      <!-- Inner Purple Core Plate -->
      <circle class="medal-inner" cx="250" cy="295" r="75" />
      
      <!-- Neon Dash Accent Ring -->
      <circle class="medal-ring" cx="250" cy="295" r="62" />

      <!-- Center Big Neon Chartreuse Star (No Text) -->
      <polygon class="medal-star" points="250,245 263,275 295,278 271,298 278,330 250,312 222,330 229,298 205,278 237,275" />

      <!-- Inner Floating Mini Stars -->
      <circle cx="250" cy="232" r="4" fill="#00E5FF" />
      <circle cx="250" cy="358" r="4" fill="#00E5FF" />
      <circle cx="187" cy="295" r="4" fill="#CCFF00" />
      <circle cx="313" cy="295" r="4" fill="#CCFF00" />
    </g>

    <!-- Floating Energy Pop Accents -->
    <!-- Top Right Yellow Lightning Bolt -->
    <g transform="translate(390, 50) rotate(20) scale(1.4)">
      <polygon class="bolt-yellow" points="20,0 0,25 15,25 5,50 35,20 18,20" />
    </g>

    <!-- Bottom Left Pink Sparkle -->
    <path class="sparkle-pink" d="M 60,360 Q 80,360 80,340 Q 80,360 100,360 Q 80,360 80,380 Q 80,360 60,360 Z" />

    <!-- Top Left Cyan Sparkle -->
    <path class="sparkle-cyan" d="M 80,140 Q 100,140 100,120 Q 100,140 120,140 Q 100,140 100,160 Q 100,140 80,140 Z" />

    <!-- Floating Sparkle Stars & Dots -->
    <polygon class="star-white" transform="translate(420, 240) scale(1.0)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <polygon class="star-white" transform="translate(60, 220) scale(0.8)" points="12,0 15,9 24,9 17,14 19,23 12,17 5,23 7,14 0,9 9,9" />
    <circle cx="445" cy="380" r="9" fill="#CCFF00" />
    <circle cx="420" cy="410" r="5" fill="#00E5FF" />
    <circle cx="95" cy="420" r="6" fill="#FF0055" />
  </g>
</svg>